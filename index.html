<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---- local storage shim, mirrors the Claude artifact storage API shape ----
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix || ""));
    return { keys };
  },
};

// ---- palette ----
const cardBg = "#FFFFFF";
const ink = "#2B2440";
const inkFaint = "rgba(43,36,64,0.55)";
const household = "#3E8EDE";
const householdSoft = "rgba(62,142,222,0.12)";
const misc = "#FF6F91";
const miscSoft = "rgba(255,111,145,0.12)";
const savingsC = "#35B37E";
const savingsSoft = "rgba(53,179,126,0.14)";
const sub = "#FFB238";
const subSoft = "rgba(255,178,56,0.16)";
const streakC = "#FF7A45";
const line = "rgba(43,36,64,0.10)";

const heading = "'Baloo 2', system-ui, sans-serif";
const body = "'Nunito', system-ui, sans-serif";
const mono = "'IBM Plex Mono', ui-monospace, monospace";

const CATS = {
  household: { label: "Household", emoji: "🏠", color: household, soft: householdSoft, tags: ["Groceries 🥦", "Utilities 💡", "Repairs 🔧", "Other"] },
  misc: { label: "Miscellaneous", emoji: "🛍️", color: misc, soft: miscSoft, tags: ["Shopping 🛒", "Eating out 🍔", "Entertainment 🎮", "Travel ✈️", "Other"] },
};

const SAVINGS_SCHEMES = [
  { key: "mf", label: "Mutual Funds", emoji: "📊", planned: 10000 },
  { key: "scheme", label: "Savings scheme", emoji: "🏦", planned: 3000 },
  { key: "gold", label: "Gold scheme", emoji: "✨", planned: 2000 },
  { key: "nps", label: "NPS", emoji: "🧓", planned: 5000 },
];

const RECURRING = [
  { key: "netflix", label: "Netflix", emoji: "🎬", amount: 649 },
  { key: "spotify", label: "Spotify", emoji: "🎵", amount: 119 },
];

const COMPONENT_LABELS = { spending: "💸 Spending vs your average", spikes: "⚡ Spike days", savings: "🐷 Savings target achievement", category: "🗂️ Category discipline" };
const WEIGHTS = { spending: 0.4, spikes: 0.2, savings: 0.25, category: 0.15 };

function todayStr() { return new Date().toISOString().slice(0, 10); }
function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }
function monthLabel(key) {
  const [y, m] = key.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("en-IN", { month: "short", year: "2-digit" });
}
function dayOfMonth(dateStr) { return Number(dateStr.slice(8, 10)); }

const emptyMonth = () => ({ entries: [], recurringConfirmed: {}, savingsContributions: [] });

function computeMonthMetrics(md) {
  const spendEntries = md.entries.filter((e) => e.catKey === "household" || e.catKey === "misc");
  const householdTotal = md.entries.filter((e) => e.catKey === "household").reduce((s, e) => s + Number(e.amount), 0);
  const miscTotal = md.entries.filter((e) => e.catKey === "misc").reduce((s, e) => s + Number(e.amount), 0);
  const subsTotal = Object.entries(md.recurringConfirmed).reduce((s, [key, on]) => {
    if (!on) return s;
    const r = RECURRING.find((x) => x.key === key);
    return s + (r ? r.amount : 0);
  }, 0);
  const total = householdTotal + miscTotal + subsTotal;

  const byDate = {};
  spendEntries.forEach((e) => { byDate[e.date] = (byDate[e.date] || 0) + Number(e.amount); });
  const activeDays = Object.keys(byDate).length;
  const avgDaily = activeDays > 0 ? Object.values(byDate).reduce((a, b) => a + b, 0) / activeDays : 0;
  const spikeDays = Object.values(byDate).filter((v) => avgDaily > 0 && v > avgDaily * 2).length;

  const savingsByScheme = {};
  SAVINGS_SCHEMES.forEach((s) => (savingsByScheme[s.key] = 0));
  md.savingsContributions.forEach((c) => { savingsByScheme[c.key] = (savingsByScheme[c.key] || 0) + Number(c.amount); });

  const householdBreakdown = {};
  md.entries.filter((e) => e.catKey === "household").forEach((e) => { householdBreakdown[e.tag] = (householdBreakdown[e.tag] || 0) + Number(e.amount); });
  const miscBreakdown = {};
  md.entries.filter((e) => e.catKey === "misc").forEach((e) => { miscBreakdown[e.tag] = (miscBreakdown[e.tag] || 0) + Number(e.amount); });

  return { householdTotal, miscTotal, subsTotal, total, spikeDays, activeDays, savingsByScheme, householdBreakdown, miscBreakdown };
}

function computeScore(thisMetrics, historyMetricsList) {
  let spendingScore = 70;
  if (historyMetricsList.length > 0) {
    const avgOthers = historyMetricsList.reduce((s, m) => s + m.total, 0) / historyMetricsList.length;
    if (avgOthers > 0) {
      const ratio = thisMetrics.total / avgOthers;
      spendingScore = ratio <= 1 ? 100 : Math.max(0, Math.round(100 - (ratio - 1) * 100));
    }
  }
  const spikesScore = Math.max(0, 100 - thisMetrics.spikeDays * 15);
  const ratios = SAVINGS_SCHEMES.map((s) => Math.min(1, (thisMetrics.savingsByScheme[s.key] || 0) / s.planned));
  const savingsScore = Math.round((ratios.reduce((a, b) => a + b, 0) / ratios.length) * 100);
  let categoryScore = 70;
  if (historyMetricsList.length > 0) {
    const avgHousehold = historyMetricsList.reduce((s, m) => s + m.householdTotal, 0) / historyMetricsList.length;
    const avgMisc = historyMetricsList.reduce((s, m) => s + m.miscTotal, 0) / historyMetricsList.length;
    const hRatio = avgHousehold > 0 ? thisMetrics.householdTotal / avgHousehold : 1;
    const mRatio = avgMisc > 0 ? thisMetrics.miscTotal / avgMisc : 1;
    const hScore = hRatio <= 1 ? 100 : Math.max(0, Math.round(100 - (hRatio - 1) * 100));
    const mScore = mRatio <= 1 ? 100 : Math.max(0, Math.round(100 - (mRatio - 1) * 100));
    categoryScore = Math.round((hScore + mScore) / 2);
  }
  const components = { spending: spendingScore, spikes: spikesScore, savings: savingsScore, category: categoryScore };
  const overall = Math.round(components.spending * WEIGHTS.spending + components.spikes * WEIGHTS.spikes + components.savings * WEIGHTS.savings + components.category * WEIGHTS.category);
  return { overall, components, hasHistory: historyMetricsList.length > 0 };
}

function suggestionFor(components, spikeDays) {
  const [key] = Object.entries(components).sort((a, b) => a[1] - b[1])[0];
  const texts = {
    spending: `Total spend ran higher than your usual pace this month. If it was a one-off, that's fine — if it's becoming the norm, trim Household or Misc by about 10% next month.`,
    spikes: `You had ${spikeDays} day${spikeDays === 1 ? "" : "s"} well above your own daily average. Try a 24-hour pause before big purchases — it catches most true impulse spikes.`,
    savings: `You're short of one or more savings targets this month. Pick the smallest gap first and set it up before month-end.`,
    category: `One category moved a lot vs its own past average — check if Misc is quietly absorbing things that deserve their own line.`,
  };
  return texts[key];
}

function Chip({ active, onClick, color, children }) {
  return (
    <button onClick={onClick} style={{ padding: "9px 15px", borderRadius: 999, border: active ? "none" : `2px solid ${line}`, background: active ? color : "transparent", color: active ? "#fff" : ink, fontFamily: body, fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", boxShadow: active ? `0 4px 10px ${color}55` : "none" }}>
      {children}
    </button>
  );
}

function EntrySheet({ catKey, onClose, onSave }) {
  const cat = CATS[catKey];
  const [tag, setTag] = useState(null);
  const [note, setNote] = useState("");
  const [amount, setAmount] = useState("");
  const canSave = tag && amount;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(43,36,64,0.4)", display: "flex", alignItems: "flex-end", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 420, margin: "0 auto", background: cardBg, borderTopLeftRadius: 26, borderTopRightRadius: 26, padding: "18px 22px 26px", display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ width: 36, height: 5, borderRadius: 3, background: line, alignSelf: "center" }} />
        <div>
          <div style={{ fontFamily: body, fontSize: 12, color: cat.color, fontWeight: 800, textTransform: "uppercase", letterSpacing: "0.04em" }}>{cat.emoji} {cat.label}</div>
          <div style={{ fontFamily: heading, fontSize: 20, color: ink, fontWeight: 700, marginTop: 3 }}>What kind, and how much?</div>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {cat.tags.map((t) => <Chip key={t} active={tag === t} onClick={() => setTag(t)} color={cat.color}>{t}</Chip>)}
        </div>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (optional)" style={{ border: "none", borderBottom: `2px solid ${line}`, outline: "none", background: "transparent", fontFamily: body, fontSize: 14.5, color: ink, padding: "7px 2px" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 4, background: cat.soft, borderRadius: 14, padding: "12px 16px" }}>
          <span style={{ fontFamily: mono, fontSize: 22, color: cat.color, opacity: 0.7 }}>₹</span>
          <input autoFocus value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9]/g, ""))} placeholder="0" style={{ border: "none", outline: "none", background: "transparent", fontFamily: mono, fontSize: 26, color: ink, width: "100%" }} />
        </div>
        <button disabled={!canSave} onClick={() => canSave && onSave({ tag, note, amount })} style={{ marginTop: 2, padding: "14px", borderRadius: 14, border: "none", background: canSave ? cat.color : line, color: "#fff", fontFamily: heading, fontWeight: 700, fontSize: 15, cursor: canSave ? "pointer" : "not-allowed", boxShadow: canSave ? `0 6px 14px ${cat.color}55` : "none" }}>
          Save 🎉
        </button>
      </div>
    </div>
  );
}

function SavingsSheet({ onClose, savingsByScheme, onAdd }) {
  const [openScheme, setOpenScheme] = useState(null);
  const [amount, setAmount] = useState("");
  const submit = () => {
    if (!amount) return;
    onAdd(openScheme, amount);
    setAmount("");
    setOpenScheme(null);
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(43,36,64,0.4)", display: "flex", alignItems: "flex-end", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 420, margin: "0 auto", background: cardBg, borderTopLeftRadius: 26, borderTopRightRadius: 26, padding: "18px 22px 26px", display: "flex", flexDirection: "column", gap: 14, maxHeight: "82vh", overflowY: "auto" }}>
        <div style={{ width: 36, height: 5, borderRadius: 3, background: line, alignSelf: "center" }} />
        <div style={{ fontFamily: heading, fontSize: 20, color: ink, fontWeight: 700 }}>🐷 Savings this month</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {SAVINGS_SCHEMES.map((s) => {
            const actual = savingsByScheme[s.key] || 0;
            const pct = Math.min(100, Math.round((actual / s.planned) * 100));
            const over = actual >= s.planned;
            return (
              <div key={s.key} style={{ border: `2px solid ${over ? savingsC : line}`, background: over ? savingsSoft : "transparent", borderRadius: 16, padding: "13px 15px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                  <span style={{ fontFamily: body, fontSize: 14.5, color: ink, fontWeight: 700 }}>{s.emoji} {s.label}</span>
                  <span style={{ fontFamily: mono, fontSize: 12.5, color: over ? savingsC : inkFaint, fontWeight: 600 }}>{over && "✅ "}₹{actual.toLocaleString("en-IN")} / ₹{s.planned.toLocaleString("en-IN")}</span>
                </div>
                <div style={{ height: 7, borderRadius: 4, background: line, marginTop: 9, overflow: "hidden" }}>
                  <div style={{ width: `${pct}%`, height: "100%", background: over ? savingsC : sub, borderRadius: 4 }} />
                </div>
                {openScheme === s.key ? (
                  <div style={{ display: "flex", gap: 8, marginTop: 11 }}>
                    <div style={{ flex: 1, display: "flex", alignItems: "center", background: savingsSoft, borderRadius: 10, padding: "8px 11px" }}>
                      <span style={{ fontFamily: mono, fontSize: 13, opacity: 0.6, marginRight: 3 }}>₹</span>
                      <input autoFocus value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9]/g, ""))} placeholder="0" style={{ border: "none", outline: "none", background: "transparent", fontFamily: mono, fontSize: 13.5, width: "100%", color: ink }} />
                    </div>
                    <button onClick={submit} style={{ border: "none", background: savingsC, color: "#fff", borderRadius: 10, padding: "0 16px", fontFamily: body, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Add</button>
                  </div>
                ) : (
                  <button onClick={() => setOpenScheme(s.key)} style={{ marginTop: 9, border: "none", background: "transparent", color: savingsC, fontFamily: body, fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: 0 }}>+ Log contribution</button>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ScoreRing({ score }) {
  const size = 138, strokeW = 12, r = (size - strokeW) / 2, circ = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  const color = score >= 75 ? savingsC : score >= 55 ? sub : misc;
  return (
    <svg width={size} height={size}>
      <circle cx={size / 2} cy={size / 2} r={r} stroke={line} strokeWidth={strokeW} fill="none" />
      <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={strokeW} fill="none" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      <text x="50%" y="45%" textAnchor="middle" fontFamily={heading} fontSize="38" fontWeight="700" fill={ink}>{score}</text>
      <text x="50%" y="64%" textAnchor="middle" fontFamily={body} fontSize="11" fill={inkFaint} fontWeight="700">{score >= 75 ? "🌟 great" : score >= 55 ? "🙂 okay" : "💪 keep going"}</text>
    </svg>
  );
}

function Bar({ label, value, max, color }) {
  const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
  return (
    <div style={{ marginBottom: 11 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: body, fontSize: 13, color: ink, fontWeight: 600, marginBottom: 4 }}>
        <span>{label}</span>
        <span style={{ fontFamily: mono, color: inkFaint, fontWeight: 500 }}>₹{value.toLocaleString("en-IN")}</span>
      </div>
      <div style={{ height: 7, borderRadius: 4, background: line, overflow: "hidden" }}>
        <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 4 }} />
      </div>
    </div>
  );
}

function TrendChart({ data }) {
  const w = 300, h = 150, padL = 26, padR = 10, padT = 10, padB = 24;
  const scores = data.map((d) => d.score);
  const minY = 0, maxY = 100;
  const xStep = data.length > 1 ? (w - padL - padR) / (data.length - 1) : 0;
  const yFor = (v) => padT + (1 - (v - minY) / (maxY - minY)) * (h - padT - padB);
  const points = data.map((d, i) => [padL + i * xStep, yFor(d.score)]);
  const pathD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {[0, 25, 50, 75, 100].map((v) => (
        <line key={v} x1={padL} x2={w - padR} y1={yFor(v)} y2={yFor(v)} stroke={line} strokeWidth="1" />
      ))}
      <path d={pathD} fill="none" stroke={household} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r="4.5" fill={household} />
      ))}
      {data.map((d, i) => (
        <text key={i} x={padL + i * xStep} y={h - 6} textAnchor="middle" fontFamily={body} fontSize="10" fill={inkFaint}>{d.name}</text>
      ))}
    </svg>
  );
}

function downloadBackup(monthsData) {
  const blob = new Blob([JSON.stringify(monthsData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `spends-tracker-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function restoreBackup(file, onDone, onError) {
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    for (const [key, value] of Object.entries(parsed)) {
      await storage.set(`month:${key}`, JSON.stringify(value));
    }
    onDone(parsed);
  } catch (e) {
    onError("Couldn't read that file — make sure it's a backup exported from this app.");
  }
}

function SettingsSheet({ onClose, monthsData, onRestored, reminderTime, onReminderChange }) {
  const [notifStatus, setNotifStatus] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [importMsg, setImportMsg] = useState("");
  const fileRef = React.useRef();

  const enableReminder = async () => {
    if (!("Notification" in window)) {
      setNotifStatus("unsupported");
      return;
    }
    const perm = await Notification.requestPermission();
    setNotifStatus(perm);
    if (perm === "granted") {
      const [h, m] = reminderTime.split(":").map(Number);
      scheduleReminder(h, m);
    }
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(43,36,64,0.4)", display: "flex", alignItems: "flex-end", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 420, margin: "0 auto", background: cardBg, borderTopLeftRadius: 26, borderTopRightRadius: 26, padding: "18px 22px 26px", display: "flex", flexDirection: "column", gap: 16, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ width: 36, height: 5, borderRadius: 3, background: line, alignSelf: "center" }} />
        <div style={{ fontFamily: heading, fontSize: 20, color: ink, fontWeight: 700 }}>⚙️ Settings & Backup</div>

        <div>
          <div style={{ fontFamily: body, fontSize: 12, color: inkFaint, fontWeight: 700, textTransform: "uppercase", marginBottom: 8 }}>Backup your data</div>
          <div style={{ fontFamily: body, fontSize: 13, color: ink, marginBottom: 10, lineHeight: 1.5 }}>Save a copy of everything you've logged. Do this before switching phones or clearing browser data.</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => downloadBackup(monthsData)} style={{ flex: 1, border: "none", background: savingsC, color: "#fff", borderRadius: 12, padding: "11px", fontFamily: body, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>⬇️ Export backup</button>
            <button onClick={() => fileRef.current.click()} style={{ flex: 1, border: `2px solid ${line}`, background: "transparent", color: ink, borderRadius: 12, padding: "11px", fontFamily: body, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>⬆️ Restore backup</button>
            <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => {
              const f = e.target.files[0];
              if (!f) return;
              restoreBackup(f, (parsed) => { setImportMsg("Restored! ✅"); onRestored(parsed); }, (err) => setImportMsg(err));
            }} />
          </div>
          {importMsg && <div style={{ fontFamily: body, fontSize: 12, color: inkFaint, marginTop: 8 }}>{importMsg}</div>}
        </div>

        <div style={{ height: 1, background: line }} />

        <div>
          <div style={{ fontFamily: body, fontSize: 12, color: inkFaint, fontWeight: 700, textTransform: "uppercase", marginBottom: 8 }}>Daily reminder</div>
          <div style={{ fontFamily: body, fontSize: 13, color: ink, marginBottom: 10, lineHeight: 1.5 }}>
            Best-effort only — this fires while the app is open in your browser. It can't reliably wake your phone the way a real app notification does, so also set a phone alarm as backup if this matters to you.
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <input type="time" value={reminderTime} onChange={(e) => onReminderChange(e.target.value)} style={{ border: `2px solid ${line}`, borderRadius: 10, padding: "8px 10px", fontFamily: mono, fontSize: 13, color: ink }} />
            <button onClick={enableReminder} style={{ border: "none", background: sub, color: "#fff", borderRadius: 10, padding: "9px 16px", fontFamily: body, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
              {notifStatus === "granted" ? "Reminder on ✅" : "Enable reminder"}
            </button>
          </div>
          {notifStatus === "denied" && <div style={{ fontFamily: body, fontSize: 12, color: misc }}>Notifications are blocked in your browser settings — you'd need to allow them there first.</div>}
          {notifStatus === "unsupported" && <div style={{ fontFamily: body, fontSize: 12, color: inkFaint }}>Your browser doesn't support notifications.</div>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState("today");
  const [monthsData, setMonthsData] = useState({});
  const [sheetCat, setSheetCat] = useState(null);
  const [showSavings, setShowSavings] = useState(false);
  const [reportIdx, setReportIdx] = useState(0);
  const [showSettings, setShowSettings] = useState(false);
  const [reminderTime, setReminderTime] = useState(() => localStorage.getItem("reminderTime") || "20:00");

  useEffect(() => {
    localStorage.setItem("reminderTime", reminderTime);
  }, [reminderTime]);

  useEffect(() => {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      const [h, m] = reminderTime.split(":").map(Number);
      scheduleReminder(h, m);
    }
  }, []);

  const today = todayStr();
  const currentMonthKey = monthKeyOf(today);

  useEffect(() => {
    (async () => {
      try {
        const listRes = await storage.list("month:");
        const keys = listRes.keys || [];
        const loaded = {};
        for (const k of keys) {
          try {
            const r = await storage.get(k);
            if (r) loaded[k.replace("month:", "")] = JSON.parse(r.value);
          } catch (e) {}
        }
        if (!loaded[currentMonthKey]) loaded[currentMonthKey] = emptyMonth();
        setMonthsData(loaded);
      } catch (e) {
        setError("Couldn't load saved data — starting fresh.");
        setMonthsData({ [currentMonthKey]: emptyMonth() });
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const saveMonth = async (key, data) => {
    setMonthsData((prev) => ({ ...prev, [key]: data }));
    try {
      const res = await storage.set(`month:${key}`, JSON.stringify(data));
      if (!res) setError("Saving didn't go through — try again.");
    } catch (e) {
      setError("Saving failed — your entry is shown but may not persist.");
    }
  };

  const currentMonth = monthsData[currentMonthKey] || emptyMonth();
  const monthKeys = useMemo(() => Object.keys(monthsData).sort(), [monthsData]);
  const metricsByMonth = useMemo(() => {
    const m = {};
    monthKeys.forEach((k) => (m[k] = computeMonthMetrics(monthsData[k])));
    return m;
  }, [monthsData, monthKeys]);

  const saveEntry = (data) => {
    const newEntry = { date: today, catKey: sheetCat, tag: data.tag, note: data.note, amount: data.amount };
    saveMonth(currentMonthKey, { ...currentMonth, entries: [...currentMonth.entries, newEntry] });
    setSheetCat(null);
  };
  const confirmRecurring = (key) => {
    saveMonth(currentMonthKey, { ...currentMonth, recurringConfirmed: { ...currentMonth.recurringConfirmed, [key]: true } });
  };
  const addSavings = (key, amount) => {
    saveMonth(currentMonthKey, { ...currentMonth, savingsContributions: [...currentMonth.savingsContributions, { key, amount, date: today }] });
  };

  const todayMetrics = useMemo(() => computeMonthMetrics(currentMonth), [currentMonth]);
  const todayHousehold = currentMonth.entries.filter((e) => e.catKey === "household" && e.date === today).reduce((s, e) => s + Number(e.amount), 0);
  const todayMisc = currentMonth.entries.filter((e) => e.catKey === "misc" && e.date === today).reduce((s, e) => s + Number(e.amount), 0);
  const todaysEntries = currentMonth.entries.filter((e) => e.date === today).slice().reverse();

  const streak = useMemo(() => {
    const daysWithEntries = new Set(currentMonth.entries.map((e) => e.date));
    let count = 0;
    let d = new Date(today);
    while (daysWithEntries.has(d.toISOString().slice(0, 10))) {
      count++;
      d.setDate(d.getDate() - 1);
      if (d.toISOString().slice(0, 7) !== currentMonthKey) break;
    }
    return count;
  }, [currentMonth, today, currentMonthKey]);

  const pendingRecurring = RECURRING.filter((r) => !currentMonth.recurringConfirmed[r.key]);
  const showRecurringCard = dayOfMonth(today) >= 5 && pendingRecurring.length > 0;

  if (loading) {
    return <div style={{ background: "#F0E9DC", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ fontFamily: body, fontSize: 14, color: ink }}>Loading your tracker… ⏳</div></div>;
  }

  return (
    <div style={{ background: "#F0E9DC", minHeight: "100vh", padding: "24px 16px 40px", fontFamily: body }}>
      <div style={{ maxWidth: 420, margin: "0 auto" }}>
        {error && <div style={{ background: "#FFF3EA", border: `1px solid ${sub}`, borderRadius: 12, padding: "10px 14px", marginBottom: 14, fontFamily: body, fontSize: 12.5, color: ink }}>⚠️ {error}</div>}

        <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
          <button onClick={() => setTab("today")} style={{ flex: 1, padding: "10px", borderRadius: 999, border: "none", background: tab === "today" ? ink : cardBg, color: tab === "today" ? "#fff" : ink, fontFamily: heading, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Today</button>
          <button onClick={() => setTab("report")} style={{ flex: 1, padding: "10px", borderRadius: 999, border: "none", background: tab === "report" ? ink : cardBg, color: tab === "report" ? "#fff" : ink, fontFamily: heading, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Report</button>
          <button onClick={() => setShowSettings(true)} style={{ padding: "10px 14px", borderRadius: 999, border: "none", background: cardBg, color: ink, fontFamily: heading, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>⚙️</button>
        </div>

        {showSettings && (
          <SettingsSheet
            onClose={() => setShowSettings(false)}
            monthsData={monthsData}
            reminderTime={reminderTime}
            onReminderChange={setReminderTime}
            onRestored={(parsed) => {
              setMonthsData(parsed);
              if (!parsed[currentMonthKey]) setMonthsData((prev) => ({ ...prev, [currentMonthKey]: emptyMonth() }));
            }}
          />
        )}

        {tab === "today" && (
          <div style={{ background: cardBg, borderRadius: 32, boxShadow: "0 16px 40px rgba(43,36,64,0.14)", position: "relative", overflow: "hidden" }}>
            <div style={{ padding: "26px 24px 0" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <div style={{ fontFamily: heading, fontSize: 26, color: ink, fontWeight: 700 }}>Today ☀️</div>
                <div style={{ display: "flex", alignItems: "center", gap: 5, background: `${streakC}18`, padding: "5px 11px", borderRadius: 999 }}>
                  <span style={{ fontSize: 13 }}>🔥</span>
                  <span style={{ fontFamily: mono, fontSize: 12.5, color: streakC, fontWeight: 700 }}>{streak} day{streak === 1 ? "" : "s"}</span>
                </div>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
                <div style={{ fontFamily: body, fontSize: 12.5, color: inkFaint, fontWeight: 600 }}>{new Date(today).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })}</div>
                <button onClick={() => setShowSavings(true)} style={{ border: "none", background: savingsSoft, color: savingsC, fontFamily: body, fontSize: 12.5, fontWeight: 800, cursor: "pointer", padding: "5px 12px", borderRadius: 999 }}>🐷 Savings</button>
              </div>
            </div>

            {showRecurringCard && (
              <div style={{ margin: "18px 24px 0", padding: "14px 16px", borderRadius: 18, background: subSoft }}>
                <div style={{ fontFamily: body, fontSize: 11.5, color: ink, opacity: 0.6, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 9, fontWeight: 700 }}>Due this month</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
                  {pendingRecurring.map((r) => (
                    <button key={r.key} onClick={() => confirmRecurring(r.key)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "transparent", border: "none", padding: 0, cursor: "pointer" }}>
                      <span style={{ fontFamily: body, fontSize: 14.5, color: ink, fontWeight: 700 }}>{r.emoji} {r.label}</span>
                      <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span style={{ fontFamily: mono, fontSize: 13, color: ink }}>₹{r.amount}</span>
                        <span style={{ fontFamily: body, fontSize: 11.5, color: sub, fontWeight: 800 }}>Confirm →</span>
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div style={{ margin: "20px 24px 10px", display: "flex", gap: 10 }}>
              {Object.entries(CATS).map(([key, c]) => {
                const total = key === "household" ? todayHousehold : todayMisc;
                return (
                  <button key={key} onClick={() => setSheetCat(key)} style={{ flex: 1, padding: "17px 15px", borderRadius: 18, border: "none", background: c.soft, color: ink, cursor: "pointer", textAlign: "left", display: "flex", flexDirection: "column", gap: 5 }}>
                    <span style={{ fontFamily: heading, fontSize: 16, fontWeight: 700, color: c.color }}>{c.emoji} {c.label}</span>
                    <span style={{ fontFamily: mono, fontSize: 13, color: total > 0 ? ink : inkFaint, fontWeight: 600 }}>{total > 0 ? `₹${total.toLocaleString("en-IN")} today` : "tap to log +"}</span>
                  </button>
                );
              })}
            </div>

            <div style={{ margin: "8px 24px 0", height: 1, background: line }} />

            <div style={{ padding: "14px 24px 24px", display: "flex", flexDirection: "column", gap: 12, minHeight: 100 }}>
              {todaysEntries.length === 0 && <div style={{ fontFamily: body, fontSize: 13, color: inkFaint }}>Nothing logged yet today 👀</div>}
              {todaysEntries.map((e, i) => {
                const c = CATS[e.catKey];
                return (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ display: "flex", gap: 9, alignItems: "flex-start" }}>
                      <span style={{ width: 8, height: 8, borderRadius: "50%", background: c.color, marginTop: 5, flexShrink: 0 }} />
                      <div>
                        <div style={{ fontFamily: body, fontSize: 13.5, color: ink, fontWeight: 700 }}>{e.tag}</div>
                        {e.note && <div style={{ fontFamily: body, fontSize: 11.5, color: inkFaint, marginTop: 1 }}>{e.note}</div>}
                      </div>
                    </div>
                    <div style={{ fontFamily: mono, fontSize: 13.5, color: ink, fontWeight: 600 }}>₹{e.amount}</div>
                  </div>
                );
              })}
            </div>

            {sheetCat && <EntrySheet catKey={sheetCat} onClose={() => setSheetCat(null)} onSave={saveEntry} />}
            {showSavings && <SavingsSheet onClose={() => setShowSavings(false)} savingsByScheme={todayMetrics.savingsByScheme} onAdd={addSavings} />}
          </div>
        )}

        {tab === "report" && (() => {
          if (monthKeys.length === 0) return null;
          const idx = Math.min(reportIdx, monthKeys.length - 1);
          const key = monthKeys[idx];
          const metrics = metricsByMonth[key];
          const historyMetrics = monthKeys.filter((k) => k !== key).map((k) => metricsByMonth[k]);
          const score = computeScore(metrics, historyMetrics);
          const maxHousehold = Math.max(1, ...Object.values(metrics.householdBreakdown));
          const maxMisc = Math.max(1, ...Object.values(metrics.miscBreakdown));
          const trendData = monthKeys.map((k) => {
            const m = metricsByMonth[k];
            const hist = monthKeys.filter((x) => x !== k).map((x) => metricsByMonth[x]);
            return { name: monthLabel(k), score: computeScore(m, hist).overall };
          });

          return (
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <div style={{ fontFamily: heading, fontSize: 20, color: ink, fontWeight: 700 }}>Report 📅</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <button onClick={() => setReportIdx(Math.max(0, idx - 1))} disabled={idx === 0} style={{ border: "none", background: cardBg, borderRadius: 10, padding: "6px 10px", cursor: idx === 0 ? "default" : "pointer", opacity: idx === 0 ? 0.3 : 1, boxShadow: "0 3px 8px rgba(43,36,64,0.08)" }}>←</button>
                  <div style={{ fontFamily: heading, fontSize: 15, color: ink, fontWeight: 700 }}>{monthLabel(key)}</div>
                  <button onClick={() => setReportIdx(Math.min(monthKeys.length - 1, idx + 1))} disabled={idx === monthKeys.length - 1} style={{ border: "none", background: cardBg, borderRadius: 10, padding: "6px 10px", cursor: idx === monthKeys.length - 1 ? "default" : "pointer", opacity: idx === monthKeys.length - 1 ? 0.3 : 1, boxShadow: "0 3px 8px rgba(43,36,64,0.08)" }}>→</button>
                </div>
              </div>

              {!score.hasHistory && <div style={{ fontFamily: body, fontSize: 12, color: inkFaint, marginBottom: 12, fontStyle: "italic" }}>Building history — spending and category scores will get more accurate once you have a few months logged.</div>}

              <div style={{ display: "flex", gap: 20, flexWrap: "wrap", background: cardBg, borderRadius: 24, padding: 22, marginBottom: 16, boxShadow: "0 8px 24px rgba(43,36,64,0.08)" }}>
                <ScoreRing score={score.overall} />
                <div style={{ flex: 1, minWidth: 180 }}>
                  {Object.entries(score.components).map(([k, v]) => (
                    <div key={k} style={{ marginBottom: 8 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: body, fontSize: 12, color: ink, fontWeight: 600 }}>
                        <span>{COMPONENT_LABELS[k]}</span>
                        <span style={{ fontFamily: mono, color: inkFaint }}>{v}</span>
                      </div>
                      <div style={{ height: 5, borderRadius: 3, background: line, marginTop: 3, overflow: "hidden" }}>
                        <div style={{ width: `${v}%`, height: "100%", background: household, borderRadius: 3 }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ background: "#FFF3EA", borderRadius: 20, padding: "16px 18px", marginBottom: 16, boxShadow: "0 6px 18px rgba(43,36,64,0.06)" }}>
                <div style={{ fontFamily: body, fontSize: 11, textTransform: "uppercase", color: streakC, marginBottom: 6, fontWeight: 800 }}>🎯 Coach's note</div>
                <div style={{ fontFamily: body, fontSize: 13.5, color: ink, lineHeight: 1.55, fontWeight: 600 }}>{suggestionFor(score.components, metrics.spikeDays)}</div>
              </div>

              <div style={{ background: cardBg, borderRadius: 22, padding: 20, marginBottom: 16, boxShadow: "0 6px 18px rgba(43,36,64,0.06)" }}>
                <div style={{ fontFamily: heading, fontSize: 16, color: household, fontWeight: 700, marginBottom: 12 }}>🏠 Household — ₹{metrics.householdTotal.toLocaleString("en-IN")}</div>
                {Object.keys(metrics.householdBreakdown).length === 0 ? <div style={{ fontFamily: body, fontSize: 12.5, color: inkFaint }}>Nothing logged yet.</div> : Object.entries(metrics.householdBreakdown).map(([k, v]) => <Bar key={k} label={k} value={v} max={maxHousehold} color={household} />)}
              </div>

              <div style={{ background: cardBg, borderRadius: 22, padding: 20, marginBottom: 16, boxShadow: "0 6px 18px rgba(43,36,64,0.06)" }}>
                <div style={{ fontFamily: heading, fontSize: 16, color: misc, fontWeight: 700, marginBottom: 12 }}>🛍️ Miscellaneous — ₹{metrics.miscTotal.toLocaleString("en-IN")}</div>
                {Object.keys(metrics.miscBreakdown).length === 0 ? <div style={{ fontFamily: body, fontSize: 12.5, color: inkFaint }}>Nothing logged yet.</div> : Object.entries(metrics.miscBreakdown).map(([k, v]) => <Bar key={k} label={k} value={v} max={maxMisc} color={misc} />)}
              </div>

              <div style={{ background: cardBg, borderRadius: 22, padding: 20, marginBottom: 16, boxShadow: "0 6px 18px rgba(43,36,64,0.06)" }}>
                <div style={{ fontFamily: heading, fontSize: 16, color: savingsC, fontWeight: 700, marginBottom: 12 }}>🐷 Savings vs target</div>
                {SAVINGS_SCHEMES.map((s) => {
                  const actual = metrics.savingsByScheme[s.key] || 0;
                  const over = actual >= s.planned;
                  const pct = Math.min(100, Math.round((actual / s.planned) * 100));
                  return (
                    <div key={s.key} style={{ marginBottom: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: body, fontSize: 12.5, color: ink, fontWeight: 600 }}>
                        <span>{over && "✅ "}{s.emoji} {s.label}</span>
                        <span style={{ fontFamily: mono, color: over ? savingsC : inkFaint }}>₹{actual.toLocaleString("en-IN")} / ₹{s.planned.toLocaleString("en-IN")}</span>
                      </div>
                      <div style={{ height: 6, borderRadius: 3, background: line, marginTop: 3, overflow: "hidden" }}>
                        <div style={{ width: `${pct}%`, height: "100%", background: over ? savingsC : sub, borderRadius: 3 }} />
                      </div>
                    </div>
                  );
                })}
              </div>

              {trendData.length > 1 && (
                <div style={{ background: cardBg, borderRadius: 22, padding: 20, boxShadow: "0 6px 18px rgba(43,36,64,0.06)" }}>
                  <div style={{ fontFamily: heading, fontSize: 16, color: ink, fontWeight: 700, marginBottom: 12 }}>📈 Health score trend</div>
                  <TrendChart data={trendData} />
                </div>
              )}
            </div>
          );
        })()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- no service worker needed -->
</body>
</html>
